name: tmp-fetch-stock
on:
  push:
    branches: [tmp-cigdem-reels]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and crop
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p clips
          i=0
          while read -r name url; do
            curl -sSL -o "src_$name.mov" "$url"
            ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 "src_$name.mov"
            ffmpeg -y -loglevel error -ss 1 -i "src_$name.mov" -t 12 -an \
              -vf "crop=ih*9/16:ih,scale=1080:1920:flags=lanczos,fps=30,format=yuv420p" \
              -c:v libx264 -preset slow -crf 19 "clips/$name.mp4"
          done < urls.txt
          ls -la clips
      - name: commit
        run: |
          git config user.name tmp-bot; git config user.email tmp-bot@users.noreply.github.com
          git rm -q --cached urls.txt; rm urls.txt
          git add clips; git commit -qm "clips"; git push
